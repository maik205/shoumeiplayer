name: Tagged release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHOUMEI_RELEASE_TAG: ${{ github.ref_name }}
      SHOUMEI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SHOUMEI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SHOUMEI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      # `secrets` isn't available in step `if:` conditions (same restriction `runner` has in a
      # job-level `env:`, below), so whether signing is configured has to be computed in a step
      # body first and read back via GITHUB_OUTPUT. This has to run before "Set keystore path":
      # app/build.gradle.kts treats "some but not all four" signing env vars as set as a hard
      # error, so SHOUMEI_KEYSTORE_PATH must stay unset when unsigned rather than pointing at a
      # path nothing ever writes.
      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # The `runner` context is only available inside step expressions/scripts, never in a
      # job-level `env:` block -- putting `${{ runner.temp }}` up there makes GitHub reject the
      # whole workflow file at parse time (every run then fails instantly with 0 jobs, regardless
      # of the `on.push.tags` filter). $RUNNER_TEMP is the equivalent real shell env var GitHub
      # injects into every step, so it's computed here and exported via GITHUB_ENV instead.
      - name: Set keystore path
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: echo "SHOUMEI_KEYSTORE_PATH=$RUNNER_TEMP/shoumei-upload.jks" >> "$GITHUB_ENV"

      - name: Check out the pinned release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate immutable release pins
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHOUMEI_RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "$SHOUMEI_RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "$SHOUMEI_RELEASE_TAG")" = "$GITHUB_SHA"
          MPV_VERSION="$(sed -n 's/^shoumei\.mpvVersion=//p' gradle.properties)"
          test -n "$MPV_VERSION"
          test "$(git -C native/mpv/upstream describe --tags --exact-match)" = "v$MPV_VERSION"
          test "$(git ls-tree HEAD native/mpv/upstream | awk '{print $3}')" = \
            "$(git -C native/mpv/upstream rev-parse HEAD)"

      # Signing is optional: with no ANDROID_KEYSTORE_BASE64 secret configured, this step is
      # skipped and the build below produces an unsigned .aab/APK (AGP just omits the signing
      # config rather than failing). An unsigned APK cannot be installed as-is -- add the four
      # ANDROID_KEYSTORE_* / ANDROID_KEY_* secrets once a real release identity exists.
      - name: Decode the upload keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SHOUMEI_KEYSTORE_PATH"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      # bundleRelease is the Play Store artifact (.aab); assembleRelease with no ABI/density/
      # language splits configured produces a single universal APK carrying all provisioned
      # native ABIs, which -- unlike the .aab -- is directly sideloadable as one file.
      - name: Build the release bundle and universal APK
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Collect release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$dir"
          cp app/build/outputs/bundle/release/app-release.aab "$dir/"
          cp app/build/outputs/apk/release/*.apk "$dir/"
          (cd "$dir" && sha256sum -- * > SHA256SUMS.txt)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.signing.outputs.configured }}" != "true" ]]; then
            echo "### :warning: Unsigned build" >> "$GITHUB_STEP_SUMMARY"
            echo "No signing secrets are configured, so this APK is unsigned and cannot be installed as-is." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shoumei-player-${{ github.ref_name }}
          path: ${{ steps.artifacts.outputs.dir }}/*
          if-no-files-found: error

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$SHOUMEI_RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "Shoumei Player ${SHOUMEI_RELEASE_TAG#v}" \
            "${{ steps.artifacts.outputs.dir }}"/*
