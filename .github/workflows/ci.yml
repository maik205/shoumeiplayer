name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      # The Android resource merger rejects any non-resource file under res/ and fails the build
      # partway through a merge, with a message that does not obviously name the culprit. Stray
      # .backup and scratch files have landed there more than once (#105), so catch them in seconds
      # rather than minutes.
      - name: Check for stray files in resource directories
        run: |
          stray=$(find app/src/main/res -type f \
            ! -name '*.xml' ! -name '*.png' ! -name '*.webp' \
            ! -name '*.9.png' ! -name '*.jpg' ! -name '*.svg' \
            ! -name '*.ttf' ! -name '*.otf' -print)
          if [ -n "$stray" ]; then
            echo "::error::Non-resource files found under app/src/main/res/. The Android resource merger rejects these:"
            echo "$stray"
            exit 1
          fi
          echo "No stray files under app/src/main/res/."

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # The navigation and focus contracts in app/src/androidTest need an emulator, which this job
      # does not have. Compiling them still catches the thing that actually rots an unrun suite:
      # a signature change in the production code they drive. See #115.
      - name: Compile instrumented tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
