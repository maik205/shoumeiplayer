# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=false
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.useAndroidX=true
# Development builds use this baseline and append "-dev". Tagged release builds
# receive their exact vMAJOR.MINOR.PATCH version through SHOUMEI_RELEASE_TAG.
shoumei.versionName=0.3.0
# Single source of truth for the player-core tag displayed in Settings and
# validated by the tagged-release workflow.
shoumei.mpvVersion=0.41.0
shoumei.mpvNativeBundleVersion=0.41.0-r3
shoumei.mpvNativeBundleUrl=https://github.com/maik205/shoumeiplayer/releases/download/native-mpv-v0.41.0-r3/shoumei-mpv-android-0.41.0-r3.zip
shoumei.mpvNativeBundleSha256=84384d70565608f39aeacca4cdb09d7071f060d15d2ff6c6b9ad123c76814722
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=false
# Disable VFS file watching on Windows to prevent daemon directory locks on build/
org.gradle.vfs.watch=false
# Run Kotlin compilation in-process to avoid external Kotlin daemon file locks on Windows
kotlin.compiler.execution.strategy=in-process
